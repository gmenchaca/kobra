<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Netlify Form Detection</title>
</head>
<body>
  <!-- Netlify escaneará este archivo y registrará el formulario -->
  <form name="kobra-cotizacion" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="opciones" />
  </form>
</body>
</html>
